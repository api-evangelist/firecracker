        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshot-create
      path: /snapshot/create
      operations:
      - name: createsnapshot
        method: PUT
        description: Creates a full or diff snapshot. Post-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshot-load
      path: /snapshot/load
