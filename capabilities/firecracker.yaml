naftiko: 1.0.0-alpha2
info:
  label: Firecracker API
  description: 'Firecracker API. 38 operations. Lead operation: Returns general information about an instance.. Self-contained
    Naftiko capability covering one Firecracker business surface.'
  tags:
  - Firecracker
  - Firecracker API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FIRECRACKER_API_KEY: FIRECRACKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: firecracker
    baseUri: http://localhost
    description: Firecracker API business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: describeinstance
        method: GET
        description: Returns general information about an instance.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: actions
      path: /actions
      operations:
      - name: createsyncaction
        method: PUT
        description: Creates a synchronous action.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: info
          in: body
          type: string
          required: true
    - name: balloon
      path: /balloon
      operations:
      - name: describeballoonconfig
        method: GET
        description: Returns the current balloon device configuration.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putballoon
        method: PUT
        description: Creates or updates a balloon device.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Balloon properties
          required: true
      - name: patchballoon
        method: PATCH
        description: Updates a balloon device.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Balloon properties
          required: true
    - name: balloon-hinting-start
      path: /balloon/hinting/start
      operations:
      - name: startballoonhinting
        method: PATCH
        description: Starts a free page hinting run only if enabled pre-boot.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: When the device completes the hinting whether we should automatically ack this.
    - name: balloon-hinting-status
      path: /balloon/hinting/status
      operations:
      - name: describeballoonhinting
        method: GET
        description: Returns the balloon hinting statistics, only if enabled pre-boot.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: balloon-hinting-stop
      path: /balloon/hinting/stop
      operations:
      - name: stopballoonhinting
        method: PATCH
        description: Stops a free page hinting run only if enabled pre-boot.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: balloon-statistics
      path: /balloon/statistics
      operations:
      - name: describeballoonstats
        method: GET
        description: Returns the latest balloon device statistics, only if enabled pre-boot.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchballoonstatsinterval
        method: PATCH
        description: Updates a balloon device statistics polling interval.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Balloon properties
          required: true
    - name: boot-source
      path: /boot-source
      operations:
      - name: putguestbootsource
        method: PUT
        description: Creates or updates the boot source. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Guest boot source properties
          required: true
    - name: cpu-config
      path: /cpu-config
      operations:
      - name: putcpuconfiguration
        method: PUT
        description: Configures CPU features flags for the vCPUs of the guest VM. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: CPU configuration request
    - name: drives-drive_id
      path: /drives/{drive_id}
      operations:
      - name: putguestdrivebyid
        method: PUT
        description: Creates or updates a drive. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: drive_id
          in: path
          type: string
          description: The id of the guest drive
          required: true
        - name: body
          in: body
          type: string
          description: Guest drive properties
          required: true
      - name: patchguestdrivebyid
        method: PATCH
        description: Updates the properties of a drive. Post-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: drive_id
          in: path
          type: string
          description: The id of the guest drive
          required: true
        - name: body
          in: body
          type: string
          description: Guest drive properties
          required: true
    - name: entropy
      path: /entropy
      operations:
      - name: putentropydevice
        method: PUT
        description: Creates an entropy device. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Guest entropy device properties
          required: true
    - name: hotplug-memory
      path: /hotplug/memory
      operations:
      - name: putmemoryhotplug
        method: PUT
        description: Configures the hotpluggable memory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Hotpluggable memory configuration
          required: true
      - name: patchmemoryhotplug
        method: PATCH
        description: Updates the size of the hotpluggable memory region
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Hotpluggable memory size update
          required: true
      - name: getmemoryhotplug
        method: GET
        description: Retrieves the status of the hotpluggable memory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: logger
      path: /logger
      operations:
      - name: putlogger
        method: PUT
        description: Initializes the logger by specifying a named pipe or a file for the logs output.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Logging system description
          required: true
    - name: machine-config
      path: /machine-config
      operations:
      - name: getmachineconfiguration
        method: GET
        description: Gets the machine configuration of the VM.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putmachineconfiguration
        method: PUT
        description: Updates the Machine Configuration of the VM. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Machine Configuration Parameters
      - name: patchmachineconfiguration
        method: PATCH
        description: Partially updates the Machine Configuration of the VM. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: A subset of Machine Configuration Parameters
    - name: metrics
      path: /metrics
      operations:
      - name: putmetrics
        method: PUT
        description: Initializes the metrics system by specifying a named pipe or a file for the metrics output.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Metrics system description
          required: true
    - name: mmds
      path: /mmds
      operations:
      - name: putmmds
        method: PUT
        description: Creates a MMDS (Microvm Metadata Service) data store.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The MMDS data store as JSON.
      - name: patchmmds
        method: PATCH
        description: Updates the MMDS data store.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The MMDS data store patch JSON.
      - name: getmmds
        method: GET
        description: Get the MMDS data store.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mmds-config
      path: /mmds/config
      operations:
      - name: putmmdsconfig
        method: PUT
        description: Set MMDS configuration. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The MMDS configuration as JSON.
          required: true
    - name: network-interfaces-iface_id
      path: /network-interfaces/{iface_id}
      operations:
      - name: putguestnetworkinterfacebyid
        method: PUT
        description: Creates a network interface. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: iface_id
          in: path
          type: string
          description: The id of the guest network interface
          required: true
        - name: body
          in: body
          type: string
          description: Guest network interface properties
          required: true
      - name: patchguestnetworkinterfacebyid
        method: PATCH
        description: Updates the rate limiters applied to a network interface. Post-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: iface_id
          in: path
          type: string
          description: The id of the guest network interface
          required: true
        - name: body
          in: body
          type: string
          description: A subset of the guest network interface properties
          required: true
    - name: pmem-id
      path: /pmem/{id}
      operations:
      - name: putguestpmembyid
        method: PUT
        description: Creates or updates a pmem device. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The id of the guest pmem device
          required: true
        - name: body
          in: body
          type: string
          description: Guest pmem device properties
          required: true
      - name: patchguestpmembyid
        method: PATCH
        description: Updates the rate limiter of a pmem device. Post-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The id of the guest pmem device
          required: true
        - name: body
          in: body
          type: string
          description: Pmem rate limiter properties
          required: true
    - name: serial
      path: /serial
      operations:
      - name: putserialdevice
        method: PUT
        description: Configures the serial console
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Serial console properties
          required: true
    - name: snapshot-create
      path: /snapshot/create
      operations:
      - name: createsnapshot
        method: PUT
        description: Creates a full or diff snapshot. Post-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The configuration used for creating a snapshot.
          required: true
    - name: snapshot-load
      path: /snapshot/load
      operations:
      - name: loadsnapshot
        method: PUT
        description: Loads a snapshot. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The configuration used for loading a snapshot.
          required: true
    - name: version
      path: /version
      operations:
      - name: getfirecrackerversion
        method: GET
        description: Gets the Firecracker version.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vm
      path: /vm
      operations:
      - name: patchvm
        method: PATCH
        description: Updates the microVM state.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: The microVM state
          required: true
    - name: vm-config
      path: /vm/config
      operations:
      - name: getexportvmconfig
        method: GET
        description: Gets the full VM configuration.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vsock
      path: /vsock
      operations:
      - name: putguestvsock
        method: PUT
        description: Creates/updates a vsock device. Pre-boot only.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: Guest vsock properties
          required: true
  exposes:
  - type: rest
    namespace: firecracker-rest
    port: 8080
    description: REST adapter for Firecracker API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: describeinstance
        description: Returns general information about an instance.
        call: firecracker.describeinstance
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/actions
      name: actions
      description: REST surface for actions.
      operations:
      - method: PUT
        name: createsyncaction
        description: Creates a synchronous action.
        call: firecracker.createsyncaction
        with:
          info: rest.info
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/balloon
      name: balloon
      description: REST surface for balloon.
      operations:
      - method: GET
        name: describeballoonconfig
        description: Returns the current balloon device configuration.
        call: firecracker.describeballoonconfig
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putballoon
        description: Creates or updates a balloon device.
        call: firecracker.putballoon
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patchballoon
        description: Updates a balloon device.
        call: firecracker.patchballoon
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/balloon/hinting/start
